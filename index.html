<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Mart</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .product-card { background: white; padding: 15px; margin: 10px; border-radius: 8px; display: inline-block; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { background: #eee; padding: 10px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; }
        .icon { font-size: 40px; }
        button { cursor: pointer; background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Tech Mart</h1>
    <p>🛒 Cart Items: <span id="header-cart-count">0</span></p>

    <hr>
    <h2>Available Products</h2>
    <div id="product-list"></div>

    <hr>
    <h2>Your Shopping Cart</h2>
    <div id="cart-display"></div>
    <h3>Total: $<span id="cart-total">0</span></h3>
    <button id="clear-cart-btn">Clear Entire Cart</button>

    <script src="js/app.js"></script>
</body>
</html>
